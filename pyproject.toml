[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["workflow_parser*"]

[project]
name = "sketric-ml-backend-test"
version = "1.0.0"
description = "ML/Backend Engineer Technical Assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit>=1.0.20",
    "livekit-api>=1.0.0",
    "livekit-agents[openai,silero,turn-detector, mcp]>=1.3.0",
    "livekit-plugins-noise-cancellation",
    "python-dotenv>=1.0.0",
]



